<svg width="128" height="128" viewBox="0 0 128 128" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient (Vibrant LAD Blue with rich contrast on light & dark tabs) -->
    <linearGradient id="favBg" x1="16" y1="12" x2="112" y2="116" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="50%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>

    <!-- Dynamic Flow Arc Gradient -->
    <linearGradient id="favFlow" x1="28" y1="96" x2="100" y2="36" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#67E8F9" />
      <stop offset="50%" stop-color="#E0E7FF" />
      <stop offset="100%" stop-color="#FFFFFF" />
    </linearGradient>

    <!-- Radiant Star Sparkle Gradient -->
    <linearGradient id="favStar" x1="78" y1="20" x2="108" y2="50" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>

    <!-- Pencil Body Gradient -->
    <linearGradient id="favPencil" x1="0" y1="0" x2="20" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#CBD5E1" />
    </linearGradient>

    <!-- Subtle Outer Border Shadow for Light Browser Tabs -->
    <filter id="favTabShadow" x="-10%" y="-10%" width="120%" height="120%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.28" />
    </filter>
  </defs>

  <!-- Base Squircle Container (Provides sharp contrast against light, dark, and custom colored browser tabs) -->
  <rect x="6" y="6" width="116" height="116" rx="28" fill="url(#favBg)" filter="url(#favTabShadow)" />
  <rect x="6.5" y="6.5" width="115" height="115" rx="27.5" stroke="#FFFFFF" stroke-opacity="0.35" stroke-width="2" />

  <!-- Gear Accent Arc (Simplified, bold, high-contrast) -->
  <path
    d="M 38 28 A 30 30 0 0 1 82 28"
    stroke="#93C5FD"
    stroke-opacity="0.45"
    stroke-width="5"
    stroke-linecap="round"
    stroke-dasharray="6 8"
  />

  <!-- Living Flow Dynamic Curve (Thick, bold, crystal-clear at 16px/32px tab sizes) -->
  <path
    d="M 32 86 C 44 98, 70 94, 80 78 C 90 62, 82 46, 68 42 C 54 38, 46 50, 48 60 C 50 70, 60 76, 72 72 C 86 67, 94 52, 94 40"
    stroke="url(#favFlow)"
    stroke-width="9"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Active Forward Direction Arrow Tip -->
  <path
    d="M 83 37 L 95 36 L 96 48"
    stroke="#FFFFFF"
    stroke-width="8"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Stylized Writing Pencil Nib at the Curve Origin -->
  <g transform="translate(30, 84) rotate(-45)">
    <!-- Nib Base / Collar -->
    <rect x="-4" y="-7" width="16" height="14" rx="2" fill="url(#favPencil)" />
    <line x1="8" y1="-7" x2="8" y2="7" stroke="#94A3B8" stroke-width="2.5" />
    <!-- Nib Tip -->
    <path d="M -4 -7 L -14 0 L -4 7 Z" fill="#F8FAFC" />
    <path d="M -9 -3.5 L -14 0 L -9 3.5 Z" fill="#0F172A" />
  </g>

  <!-- Radiant Dynamic Star Sparkle -->
  <g transform="translate(86, 30)">
    <path
      d="M 0 -15 C 0 -4.5, 4.5 0, 15 0 C 4.5 0, 0 4.5, 0 15 C 0 4.5, -4.5 0, -15 0 C -4.5 0, 0 -4.5, 0 -15 Z"
      fill="url(#favStar)"
    />
    <circle cx="0" cy="0" r="3.5" fill="#FFFFFF" />
  </g>
</svg>
